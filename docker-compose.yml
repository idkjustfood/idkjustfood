# Self-hosted idkjustfood. Works with `docker compose up` and as a Coolify resource.
# No host ports are published: put a reverse proxy in front (Coolify does this for you).
# The proxy routes to `api` on port 3001 and to `web` on port 80.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idkjustfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idkjustfood}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the database migrations once, then exits. The api and worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: "no"
    command: ["bun", "packages/database/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-idkjustfood}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-idkjustfood}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["bun", "apps/api/src/index.ts"]
    environment: &server-env
      DATABASE_URL: postgres://${POSTGRES_USER:-idkjustfood}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-idkjustfood}
      PORT: 3001
      APP_URL: ${APP_URL:-}
      BETTER_AUTH_URL: ${API_URL:?Set API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_PARSING_MODEL: ${AI_PARSING_MODEL:-}
      # Optional: let one job use a different provider (see docs/ai-providers.md)
      AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-}
      AI_TRANSCRIPTION_API_KEY: ${AI_TRANSCRIPTION_API_KEY:-}
      AI_TRANSCRIPTION_BASE_URL: ${AI_TRANSCRIPTION_BASE_URL:-}
      AI_VISION_PROVIDER: ${AI_VISION_PROVIDER:-}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_PARSING_PROVIDER: ${AI_PARSING_PROVIDER:-}
      AI_PARSING_API_KEY: ${AI_PARSING_API_KEY:-}
      AI_PARSING_BASE_URL: ${AI_PARSING_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["bun", "apps/worker/src/index.ts"]
    environment: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker has no HTTP port, so check that it can reach the database.
      test: ["CMD", "bun", "-e", "const sql = (await import('postgres')).default(process.env.DATABASE_URL); await sql`select 1`; process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${API_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

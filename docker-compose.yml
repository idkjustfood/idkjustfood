# Self-hosted idkjustfood. Works with `docker compose up` and as a Coolify resource.
# No host ports are published: put a reverse proxy in front (Coolify does this for you).
# The proxy routes to `api` on port 3001 and to `web` on port 80.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idkjustfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idkjustfood}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["bun", "apps/api/src/index.ts"]
    environment: &server-env
      DATABASE_URL: postgres://${POSTGRES_USER:-idkjustfood}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-idkjustfood}
      PORT: 3001
      APP_URL: ${APP_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_PARSING_MODEL: ${AI_PARSING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["bun", "apps/worker/src/index.ts"]
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP port, so check that it can reach the database.
      test: ["CMD", "bun", "-e", "const sql = (await import('postgres')).default(process.env.DATABASE_URL); await sql`select 1`; process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${API_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
